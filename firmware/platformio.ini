; The WiC64 firmware for the C64 Mac-look desktop: the WiC64 transfer
; protocol on the user port, with the file service (docs/fileservice.md)
; on the WiC64's flash and network (SMB) shares.
;
;   pio run -t upload       build and flash the firmware
;   pio run -t uploadfs     put ../flash (the startup disk) into the flash
;   pio device monitor      the log, at 115200 baud

[platformio]
data_dir = ../flash

[env:wic64]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
monitor_speed = 115200
extra_scripts = pre:fetch_libsmb2.py
build_flags =
    -DCORE_DEBUG_LEVEL=1
